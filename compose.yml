
services:
  traefik:
    image: "traefik:latest"
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"


  web:
    build: 
      context: frontend
      dockerfile: Dockerfile-prod
      args:
        - VITE_API_SERVER=http://localhost
        - VITE_IDP_SERVER=https://id.oglimmer.de/realms/test
        - VITE_IDP_CLIENT_ID=test-client
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  api1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - GOOGLE_MAPS_APIKEY=${VITE_GOOGLE_MAPS_API_KEY}
      - MARIADB_HOST=mariadb
      - PICZ_TEMPORARYFILESTORAGE_HOST=s3
      - PICZ_TEMPORARYFILESTORAGE_PORT=8080
    volumes:
      - ./data:/tmp/picz/
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api1.rule=PathPrefix(`/api`) || PathPrefix(`/swagger-ui/`) || PathPrefix(`/v3/api-docs`)"
      - "traefik.http.routers.api1.entrypoints=web"
      - "traefik.http.routers.api1.service=api1"
      - "traefik.http.services.api1.loadbalancer.server.port=8080"
    depends_on:
      mariadb:
        condition: service_healthy

  api2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - GOOGLE_MAPS_APIKEY=${VITE_GOOGLE_MAPS_API_KEY}
      - MARIADB_HOST=mariadb
      - PICZ_TEMPORARYFILESTORAGE_HOST=s3
      - PICZ_TEMPORARYFILESTORAGE_PORT=8080
    volumes:
      - ./data:/tmp/picz/
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api2.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api2.entrypoints=web"
      - "traefik.http.routers.api2.service=api2"
      - "traefik.http.services.api2.loadbalancer.server.port=8080"
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root}
      - MARIADB_DATABASE=picz_prod
      - MARIADB_USER=picz-app
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-foobar}
    healthcheck:
      test: mariadb -upicz-app -p${MARIADB_PASSWORD:-foobar} picz_prod -e "select 1"
      interval: 10s
      timeout: 60s
      retries: 5
    ports:
      - "3306:3306"

  s3:
    image: ghcr.io/oglimmer/s3fs-go:main
